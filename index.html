<meta name="description" content="Galéria Gemera: hrady, kaštiele, kostoly a mestá Gemera a Malohontu na starých pohľadniciach a dnes.">

<style>
:root{
  --ink:#211D18; --paper:#F3EDE1; --paper-xl:#FAF6EC; --sepia-d:#5F4A2C;
  --rust:#A8462F; --rust-d:#832F1D; --muted:#6E6355; --line:#DCD0B4; --card:#FFFDF8;
  --serif:"Fraunces",Georgia,serif; --sans:"Inter",system-ui,sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:var(--sans);color:var(--ink);background:#c5ad88;line-height:1.55;font-size:16px}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:#c5ad88 url(logo/pozadie.jpg) center/cover no-repeat}
img{display:block;max-width:100%}
a{color:var(--rust-d)}
.wrap{max-width:1160px;margin:0 auto;padding:0 20px}
h1,h2,h3{font-family:var(--serif);line-height:1.15;margin:0;font-weight:700}

header{position:sticky;top:0;z-index:50;background:rgba(243,237,225,.82);backdrop-filter:blur(8px);border-bottom:1px solid rgba(95,74,44,.25)}
.nav{display:flex;align-items:center;justify-content:space-between;height:64px;gap:12px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font-family:var(--serif);font-weight:700;font-size:1.05rem;white-space:nowrap}
.brand .erb{width:36px;height:36px;border-radius:50%;flex:none}
.brand .erb{width:34px;height:40px;border-radius:0;overflow:visible}
.erb-wing{transform-box:view-box;transform-origin:205px 240px;animation:erb-flap 3.2s ease-in-out infinite}
.erb-head{transform-box:view-box;transform-origin:250px 180px;animation:erb-head 6.4s ease-in-out infinite}
.erb-eagle{transform-box:view-box;transform-origin:250px 300px;animation:erb-breathe 3.2s ease-in-out infinite}
.brand:hover .erb-wing{animation-duration:.9s}
@keyframes erb-flap{0%,100%{transform:rotate(0)}45%{transform:rotate(9deg)}55%{transform:rotate(8deg)}}
@keyframes erb-head{0%,40%,100%{transform:rotate(0)}50%,70%{transform:rotate(-4deg)}}
@keyframes erb-breathe{0%,100%{transform:translateY(0)}45%{transform:translateY(-6px)}}
@media (prefers-reduced-motion:reduce){.erb-wing,.erb-head,.erb-eagle{animation:none}}

.hero{padding:44px 0 18px}
.hero h1{font-size:clamp(2.1rem,6vw,3.4rem);margin-bottom:10px}
.hero p{margin:0;color:#3d3328;font-size:1.08rem;max-width:560px}


.grid{padding-top:18px;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px;padding-bottom:56px}
.card{background:var(--card);border:1px solid rgba(95,74,44,.25);box-shadow:0 6px 18px rgba(60,40,20,.18);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:2px;aspect-ratio:4/3;background:var(--line)}
.duo figure{position:relative;margin:0;overflow:hidden}
.duo img{width:100%;height:100%;object-fit:cover}
.duo .old{filter:sepia(.15)}
.duo .lb{position:absolute;top:10px;left:10px;background:#000a;color:#fff;font:600 .68rem var(--sans);letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:5px}
dialog .duo{aspect-ratio:3/2}
dialog .duo img{object-fit:contain;background:#1b1916}
@media (max-width:600px){dialog .duo{grid-template-columns:1fr;aspect-ratio:auto}dialog .duo figure{aspect-ratio:4/3}}
.meta{padding:12px 14px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.meta h3{font-size:1.08rem}
.meta p{margin:2px 0 0;color:var(--muted);font-size:.88rem}
.more{flex:none;border:1px solid var(--line);background:transparent;border-radius:999px;width:34px;height:34px;font:600 1rem var(--serif);color:var(--sepia-d);cursor:pointer}
.more:hover{background:var(--paper)}

dialog{border:0;border-radius:16px;padding:0;max-width:760px;width:calc(100% - 24px);background:var(--card);color:var(--ink)}
dialog::backdrop{background:#211d18cc}
.dlg-body{padding:18px 20px 20px}
.dlg-body h3{font-size:1.4rem}
.dlg-body .pl{color:var(--muted);margin:2px 0 10px}
.dlg-body p{margin:0 0 12px}
.src{font-size:.8rem;color:var(--muted);border-top:1px solid var(--line);padding-top:10px;line-height:1.5}
.x{position:absolute;right:10px;top:10px;z-index:3;width:36px;height:36px;border-radius:50%;border:0;background:#000a;color:#fff;font-size:1.2rem;cursor:pointer}


footer{background:rgba(33,29,24,.92);color:#d9cfbd;padding:28px 0;font-size:.85rem}
footer a{color:#fff}
footer .wrap{display:flex;flex-wrap:wrap;gap:8px 24px;justify-content:space-between}
</style>

d": "tornala-kastiel", "name": "Kaštieľ Tornallyayovcov", "place": "Tornaľa", "g": "hrady", "desc": "Klasicistická kúria so stĺpovým portikom, sídlo rodu Tornallyayovcov, podľa ktorého dostalo mesto meno.", "old": {"src": "Zempléni Múzeum (Szerencs)", "title": "Tornallya, Tornalja Özv. tornallyay Dezsőné urilakja", "url": "https://gallery.hungaricana.hu/hu/SzerencsKepeslap/1255333/", "date": "1936.12.22", "img": "fotky/tornala-kastiel-kedysi.jpg", "w": 773, "h": 512}, "new": {"author": "Szeder László", "lic": "CC BY-SA 4.0", "url": "https://commons.wikimedia.org/wiki/File:Tornalja084.JPG", "date": "2010-07-07", "img": "fotky/tornala-kastiel-dnes.jpg", "w": 960, "h": 720}}, {"id": "tornala-kostol", "name": "Gotický kostol", "place": "Tornaľa", "g": "kostoly", "desc": "Reformovaný kostol z 15. storočia s neskoršou vežou a vstupnou bránou v ohradnom múre.", "old": {"src": "Zempléni Múzeum (Szerencs)", "title": "Tornalja. 15. századi gótikus templom", "url": "https://gallery.hungaricana.hu/hu/SzerencsKepeslap/1389708/", "date": "", "img": "fotky/tornala-kostol-kedysi.jpg", "w": 347, "h": 512}, "new": {"author": "David Raška", "lic": "CC BY-SA 4.0", "url": "https://commons.wikimedia.org/wiki/File:Torna%C4%BEa1.jpg", "date": "2020-01-04", "img": "fotky/tornala-kostol-dnes.jpg", "w": 750, "h": 1000}}, {"id": "tornala-radnica", "name": "Radnica", "place": "Tornaľa", "g": "mesta", "desc": "Budova radnice z medzivojnového obdobia v centre Tornale.", "old": {"src": "Zempléni Múzeum (Szerencs)", "title": "Tornallya, Tornalja Városháza", "url": "https://gallery.hungaricana.hu/hu/SzerencsKepeslap/1255335/", "date": "", "img": "fotky/tornala-radnica-kedysi.jpg", "w": 769, "h": 512}, "new": {"author": "Szeder László", "lic": "CC BY-SA 4.0", "url": "https://commons.wikimedia.org/wiki/File:Tornalja004.JPG", "date": "2010-07-07", "img": "fotky/tornala-radnica-dnes.jpg", "w": 960, "h": 720}}, {"id": "stitnik-ev", "name": "Evanjelický kostol", "place": "Štítnik", "g": "kostoly", "desc": "Gotický kostol zo 14. storočia s mimoriadne bohatými nástennými maľbami. Patrí na Gotickú cestu.", "old": {"src": "Zempléni Múzeum (Szerencs)", "title": "Csetnek Evangélikus templom", "url": "https://gallery.hungaricana.hu/hu/SzerencsKepeslap/1184411/", "date": "", "img": "fotky/stitnik-ev-kedysi.jpg", "w": 781, "h": 512}, "new": {"author": "PosoniumAster", "lic": "CC BY-SA 4.0", "url": "https://commons.wikimedia.org/wiki/File:%C5%A0t%C3%ADtnik.jpg", "date": "2015-07-31", "img": "fotky/stitnik-ev-dnes.jpg", "w": 960, "h": 640}}, {"id": "brzotin", "name": "Kaštieľ", "place": "Brzotín", "g": "hrady", "desc": "Barokový kaštieľ z roku 1729, ktorý postavili Mariášiovci. Neskôr patril rodine Hámošovcov.", "old": {"src": "Országos Széchényi Könyvtár (Budapešť)", "title": "Berzete, Hámos-kastély Berzétén", "url": "https://gallery.hungaricana.hu/hu/OSZKKepeslap/1407809/", "date": "", "img": "fotky/brzotin-kedysi.jpg", "w": 768, "h": 512}, "new": {"author": "IDD5000", "lic": "CC BY-SA 4.0", "url": "https://commons.wikimedia.org/wiki/File:Brzotin_-_Mari%C3%A1%C5%A1iovsk%C3%BD_kastiel%27_-_1729_(a).jpg", "date": "2020-09-24", "img": "fotky/brzotin-dnes.jpg", "w": 960, "h": 600}}, {"id": "hanva", "name": "Hrob Mihálya Tompu", "place": "Chanava", "g": "mesta", "desc": "Náhrobný obelisk básnika Mihálya Tompu (1817 – 1868), ktorý v Chanave pôsobil ako reformovaný farár a je tu aj pochovaný.", "old": {"src": "Országos Széchényi Könyvtár (Budapešť)", "title": "Hanva, Tompa sírja Hamván", "url": "https://gallery.hungaricana.hu/hu/OSZKKepeslap/1414872/", "date": "1910.07.29", "img": "fotky/hanva-kedysi.jpg", "w": 331, "h": 512}, "new": {"author": "Farkas Gergely", "lic": "CC BY-SA 3.0", "url": "https://commons.wikimedia.org/wiki/File:Tompa_Mih%C3%A1ly_s%C3%ADrja_Hanv%C3%A1n.JPG", "date": "2014-04-17", "img": "fotky/hanva-dnes.jpg", "w": 750, "h": 1000}}, {"id": "gemer", "name": "Kaštieľ Szentiványiovcov", "place": "Gemer", "g": "hrady", "desc": "Kaštieľ v obci, podľa ktorej dostal meno celý región. Obec bola v stredoveku centrom Gemerskej župy.", "old": {"src": "Országos Széchényi Könyvtár (Budapešť)", "title": "Sajógömör, Üdvözlet Sajógömörből. Szentiványi kastély; Ág. ev. templom; Szentiv…", "url": "https://gallery.hungaricana.hu/hu/OSZKKepeslap/1429007/", "date": "", "img": "fotky/gemer-kedysi.jpg", "w": 790, "h": 512}, "new": {"author": "Szeder László", "lic": "CC BY-SA 4.0", "url": "https://commons.wikimedia.org/wiki/File:Saj%C3%B3g%C3%B6m%C3%B6r38.JPG", "date": "2010-07-06", "img": "fotky/gemer-dnes.jpg", "w": 960, "h": 720}}, {"id": "rimavska-sec", "name": "Rímskokatolícky kostol", "place": "Rimavská Seč", "g": "kostoly", "desc": "Kostol s vysokou vežou v centre obce na juhu Gemera.", "old": {"src": "Zempléni Múzeum (Szerencs)", "title": "Rimaszécs. Róm. kat. templom", "url": "https://gallery.hungaricana.hu/hu/SzerencsKepeslap/1356442/", "date": "1932.07.28", "img": "fotky/rimavska-sec-kedysi.jpg", "w": 778, "h": 512}, "new": {"author": "Farkas Gergely", "lic": "CC BY-SA 3.0", "url": "https://commons.wikimedia.org/wiki/File:R%C3%B3mai_katolikus_templom_Rimasz%C3%A9cs.JPG", "date": "2012-10-20", "img": "fotky/rimavska-sec-dnes.jpg", "w": 750, "h": 1000}}, {"id": "domica", "name": "Jaskyňa Domica", "place": "Kečovo", "g": "priroda", "desc": "Krasová jaskyňa objavená v roku 1926, známa podzemnou plavbou po riečke Styx. Od roku 1995 patrí do svetového dedičstva UNESCO (jaskyne Aggteleckého krasu a Slovenského krasu).", "old": {"src": "Zempléni Múzeum (Szerencs)", "title": "Domica, jaskyňa KSTL. Dóm inlckých pagod", "url": "https://gallery.hungaricana.hu/hu/SzerencsKepeslap/1355632/", "date": "", "img": "fotky/domica-kedysi.jpg", "w": 773, "h": 512}, "new": {"author": "Jojo, en:Jojo_1, pl:Jojo", "lic": "CC BY-SA 3.0", "url": "https://commons.wikimedia.org/wiki/File:Domica_Cave_19.jpg", "date": "2006-08-15", "img": "fotky/domica-dnes.jpg", "w": 960, "h": 640}}, {"id": "rimavska-bana", "name": "Evanjelický kostol", "place": "Rimavská Baňa", "g": "kostoly", "desc": "Stredoveký kostol s gotickými nástennými maľbami a opevnením. Patrí na Gotickú cestu.", "old": {"src": "Zempléni Múzeum (Szerencs)", "title": "Rimabánya, Üdvözlet Rimabányáról. Pályaudvar; Lutheránus templom", "url": "https://gallery.hungaricana.hu/hu/SzerencsKepeslap/1383333/", "date": "1907", "img": "fotky/rimavska-bana-kedysi.jpg", "w": 783, "h": 512}, "new": {"author": "Ladislav Luppa", "lic": "CC BY-SA 4.0", "url": "https://commons.wikimedia.org/wiki/File:Rimavsk%C3%A1_Ba%C5%88a_-_Evanjelick%C3%BD_kostol_(1).jpg", "date": "2014-09-24", "img": "fotky/rimavska-bana-dnes.jpg", "w": 960, "h": 640}}, {"id": "hrhov", "name": "Hrhovský vodopád", "place": "Hrhov", "g": "priroda", "desc": "Travertínový vodopád na úpätí Slovenského krasu, chránený ako prírodná pamiatka.", "old": {"src": "Országos Széchényi Könyvtár (Budapešť)", "title": "Tornagörgő. Vízesés; Ördöglyuk-barlang bejárata; Forrás", "url": "https://gallery.hungaricana.hu/hu/OSZKKepeslap/1436146/", "date": "", "img": "fotky/hrhov-kedysi.jpg", "w": 777, "h": 512}, "new": {"author": "PeterWiki56", "lic": "CC BY-SA 4.0", "url": "https://commons.wikimedia.org/wiki/File:Hrhov_Waterfall.jpg", "date": "2021-07-24", "img": "fotky/hrhov-dnes.jpg", "w": 750, "h": 1000}}, {"id": "ochtina", "name": "Evanjelický kostol", "place": "Ochtiná", "g": "kostoly", "desc": "Gotický kostol zo 14. storočia so vzácnymi stredovekými maľbami v presbytériu. Patrí na Gotickú cestu.", "old": {"src": "Országos Széchényi Könyvtár (Budapešť)", "title": "Mártonháza, Martonháza. Utcarészlet; Templom; Vasútállomás", "url": "https://gallery.hungaricana.hu/hu/OSZKKepeslap/1422255/", "date": "", "img": "fotky/ochtina-kedysi.jpg", "w": 781, "h": 512}, "new": {"author": "PosoniumAster", "lic": "CC BY-SA 4.0", "url": "https://commons.wikimedia.org/wiki/File:Ochtin%C3%A1_(2).jpg", "date": "2017-08-15", "img": "fotky/ochtina-dnes.jpg", "w": 960, "h": 645}}];
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function cmp(d,eager){
  const l=eager?'':' loading="lazy"';
  return `<div class="duo">
    <figure><img class="old" src="${d.old.img}" alt="${esc(d.name)} kedysi"${l}><span class="lb">Kedysi</span></figure>
    <figure><img src="${d.new.img}" alt="${esc(d.name)} dnes"${l}><span class="lb">Dnes</span></figure>
  </div>`;
}
const grid=document.getElementById('grid');
grid.innerHTML=DATA.map((d,i)=>`<article class="card" data-g="${d.g}">
  ${cmp(d,i<3)}
  <div class="meta"><div><h3>${esc(d.name)}</h3><p>${esc(d.place)}</p></div>
  <button class="more" data-i="${i}" aria-label="Viac o pamiatke ${esc(d.name)}">i</button></div>
</article>`).join('');
const dlg=document.getElementById('dlg');
grid.addEventListener('click',e=>{
  const b=e.target.closest('.more');if(!b)return;
  const d=DATA[b.dataset.i];
  const od=d.old.date?`, pečiatka ${esc(d.old.date)}`:'';
  document.getElementById('dlg-in').innerHTML=`${cmp(d,true)}
  <div class="dlg-body"><h3>${esc(d.name)}</h3><p class="pl">${esc(d.place)}</p><p>${esc(d.desc)}</p>
  <div class="src">Kedysi: pohľadnica „${esc(d.old.title)}“${od} · ${esc(d.old.src)} · <a href="${d.old.url}" target="_blank" rel="noopener">Hungaricana</a><br>
  Dnes: ${esc(d.new.author)} · ${esc(d.new.lic)} · <a href="${d.new.url}" target="_blank" rel="noopener">Wikimedia Commons</a></div></div>`;
  dlg.showModal();
});
dlg.addEventListener('click',e=>{if(e.target===dlg)dlg.close()});
</script>
